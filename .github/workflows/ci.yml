name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PY_VERSION: "3.11"

jobs:
  lint:
    name: lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip

      - name: Install (dev extras, same as local)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format --check
        run: ruff format --check src tests

      - name: mypy
        run: mypy src

  test:
    name: test (unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip

      - name: Install (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pytest
        run: pytest -q

  dockerfile-lint:
    name: dockerfile syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install hadolint
        run: |
          sudo wget -O /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      # Blocking as of P8. The `|| true` that used to sit here was a Step-0 placeholder; the
      # Dockerfile is now the production image the chart deploys, so a lint failure is a real
      # finding. `--failure-threshold warning` matches `make hadolint`.
      - name: Lint Dockerfile
        run: hadolint --failure-threshold warning Dockerfile

  helm-lint:
    name: helm chart lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      # Standard 11 section 11.7: a red `helm lint` blocks merge. The script additionally
      # asserts the four-Deployment shape (D27) and that no real secret renders.
      - name: Lint and render the chart
        run: bash deploy/helm/inframind/tests/helm-lint.sh

      - name: Package the chart
        run: helm package deploy/helm/inframind -d /tmp/chart

      - name: Upload the packaged chart
        uses: actions/upload-artifact@v4
        with:
          name: inframind-chart
          path: /tmp/chart/*.tgz
          retention-days: 7

  # D31: publish the image to GitHub Container Registry so a codespace (or anyone) can
  # `make image-pull` instead of building. Only after the gates pass, only on the five fixed
  # branches (never on PR merges into main from forks). Tags: the branch name and sha-<short>.
  image-publish:
    name: publish image to ghcr.io
    if: >-
      github.event_name == 'push' &&
      contains(fromJSON('["refs/heads/dev","refs/heads/main","refs/heads/dev-rifat","refs/heads/dev-moneem","refs/heads/dev-prome"]'), github.ref)
    needs: [lint, test, dockerfile-lint, helm-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
