repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Helm templates under deploy/helm/*/templates/ are Go templates, not YAML — the
        # {{ }} directives do not parse. The chart's real correctness gate is
        # `make chart-lint` (helm lint + helm template + the D27 / no-secret guards), which
        # CI runs as a blocking job.
        exclude: ^paper/|^testbed/boutique/base/|^testbed/boutique/patches/(memory-patches|tracing)\.yaml$|^deploy/helm/.*/templates/
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: no-commit-to-branch
        args: ["--branch=main"]
