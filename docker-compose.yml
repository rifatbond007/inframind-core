# InfraMind — local dev stack.
#
# Two ways to run InfraMind:
#   * This file — the non-Kubernetes path. Redis + Postgres plus the four pipeline
#     processes, each in its own container, all from the root `Dockerfile`.
#   * `deploy/helm/inframind/` — the Kubernetes path. `make up-app` installs the chart
#     into the kind cluster next to Online Boutique and the observability stack.
#
# The collectors (prometheus / loki / jaeger) reach the testbed backends through
# `host.docker.internal`, which is the cross-platform way for a containerised process to
# reach the kind cluster's NodePorts. On Linux this needs
# `extra_hosts: ["host.docker.internal:host-gateway"]`, wired per service below.
#
# Usage:
#   docker compose up -d          # all six InfraMind processes + both backends
#   make up-app                   # the Helm path instead
#   make logs                     # tail

x-common-env: &common-env
  REDIS_URL: redis://redis:6379/0
  POSTGRES_URL: postgresql://inframind:inframind@postgres:5432/inframind
  # The testbed's NodePorts, reached from inside a container.
  PROMETHEUS_URL: http://host.docker.internal:30090
  LOKI_URL: http://host.docker.internal:30100
  JAEGER_URL: http://host.docker.internal:30686
  # D9: a dev-only placeholder. Never a real secret, never committed.
  INFRAMIND_ALERT_WEBHOOK_SECRET: dev-secret
  METRICS_PORT: "9100"

x-common-build: &common-build
  build:
    context: .
    dockerfile: Dockerfile

x-common-extra-hosts: &common-extra-hosts
  - "host.docker.internal:host-gateway"

services:
  redis:
    image: redis:7-alpine
    container_name: inframind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: inframind-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inframind}
      POSTGRES_USER: ${POSTGRES_USER:-inframind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inframind}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER:-inframind}" -d "$${POSTGRES_DB:-inframind}"'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # --- pipeline ---

  api:
    <<: *common-build
    image: inframind:dev
    container_name: inframind-api
    restart: unless-stopped
    command: ["python", "-m", "inframind.api.app"]
    ports:
      - "8080:8080"
    environment: *common-env
    extra_hosts: *common-extra-hosts
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Detection and correlation are one process (`correlation.worker`): the correlation worker
  # reads stream:signals, runs the engine, and writes incidents back to the bus. Same
  # reasoning as the chart's `deployment-detection.yaml`.
  detection:
    <<: *common-build
    image: inframind:dev
    container_name: inframind-detection
    restart: unless-stopped
    command: ["python", "-m", "inframind.correlation.worker"]
    ports:
      - "9100:9100"
    environment: *common-env
    extra_hosts: *common-extra-hosts
    depends_on:
      redis:
        condition: service_healthy

  rca:
    <<: *common-build
    image: inframind:dev
    container_name: inframind-rca
    restart: unless-stopped
    # The composition root (D28): the RCA worker plus storage, the LLM explainer and the
    # alert router. `inframind.rca.worker` alone would rank and store nothing.
    command: ["python", "-m", "inframind.main"]
    ports:
      - "9101:9100"
    environment:
      <<: *common-env
      # LLM explainer: an OpenAI-compatible API (Groq by default). Put LLM_API_KEY in the
      # gitignored .env; compose reads it from there. Without a key every summary is the
      # deterministic template. The local Ollama fallback is off (no local model here).
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-20}
      INFRAMIND_LLM_OLLAMA_FALLBACK: ${INFRAMIND_LLM_OLLAMA_FALLBACK:-false}
      INFRAMIND_ALERTING_WEBHOOK_URL: ${INFRAMIND_ALERTING_WEBHOOK_URL:-}
    extra_hosts: *common-extra-hosts
    # D21 cold start: the directory the RCA worker reads service-graph.json from and writes it
    # back to. A missing file is a cold graph, never a crash. A named volume, not a host bind
    # mount: the image runs as uid 10001 and a host-owned ./data was not writable, so the
    # snapshot failed with "Permission denied" (the chart uses an emptyDir the same way).
    volumes:
      - graph-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  ingestion-prometheus:
    <<: *common-build
    image: inframind:dev
    container_name: inframind-ingestion-prometheus
    restart: unless-stopped
    command: ["python", "-m", "inframind.ingestion.prometheus"]
    ports:
      - "9102:9100"
    environment: *common-env
    extra_hosts: *common-extra-hosts
    depends_on:
      redis:
        condition: service_healthy

  ingestion-loki:
    <<: *common-build
    image: inframind:dev
    container_name: inframind-ingestion-loki
    restart: unless-stopped
    command: ["python", "-m", "inframind.ingestion.loki"]
    ports:
      - "9103:9100"
    environment: *common-env
    extra_hosts: *common-extra-hosts
    depends_on:
      redis:
        condition: service_healthy

  ingestion-jaeger:
    <<: *common-build
    image: inframind:dev
    container_name: inframind-ingestion-jaeger
    restart: unless-stopped
    command: ["python", "-m", "inframind.ingestion.jaeger"]
    ports:
      - "9104:9100"
    environment: *common-env
    extra_hosts: *common-extra-hosts
    # The Jaeger collector is the one that publishes graph updates, so it and the RCA worker
    # share /app/data — otherwise the RCA worker never sees a cold-start snapshot.
    volumes:
      - graph-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
  graph-data:
