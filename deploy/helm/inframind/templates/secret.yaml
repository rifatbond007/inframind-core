{{- /* Render only when the chart owns the Secret — `existingSecret` lets the operator point at
       one they control. The values here are placeholders (standard 11 section 11.4). A reviewer
       who sees a non-empty `stringData` in the rendered output rejects the PR. */ -}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "inframind.fullname" . }}-secrets
  labels:
    {{- include "inframind.labels" . | nindent 4 }}
  annotations:
    # Surface a non-empty value at install time. Helm 3.x renders `stringData` into `data` and
    # base64-encodes; an empty value is what the committed chart ships.
    helm.sh/resource-policy: keep
stringData:
  {{- if .Values.secretRef.LLM_API_KEY }}
  llm-api-key: {{ .Values.secretRef.LLM_API_KEY | quote }}
  {{- else }}
  llm-api-key: ""
  {{- end }}
  {{- if .Values.secretRef.INFRAMIND_ALERT_WEBHOOK_SECRET }}
  inframind-alert-webhook-secret: {{ .Values.secretRef.INFRAMIND_ALERT_WEBHOOK_SECRET | quote }}
  {{- else }}
  inframind-alert-webhook-secret: ""
  {{- end }}
{{- end }}
