# NodePort Service for the allInOne Jaeger pod (see testbed/helm-values/jaeger.yaml).
# Host ports 30686/30317/30318 are forwarded by testbed/kind/cluster.yaml (D1/D4).
apiVersion: v1
kind: Service
metadata:
  name: jaeger-nodeports
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: jaeger
    app.kubernetes.io/component: all-in-one
  ports:
    - name: query
      port: 16686
      targetPort: 16686
      nodePort: 30686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      nodePort: 30317
    - name: otlp-http
      port: 4318
      targetPort: 4318
      nodePort: 30318
