# testbed/boutique/patches/tracing.yaml
#
# Send traces from the Online Boutique services that ship OpenTelemetry
# support to the Jaeger collector's OTLP gRPC port (D1). Without this the
# Jaeger query UI has no services and the RCA service graph (D21) has
# nothing to be built from.
#
# Env contract is upstream's: ENABLE_TRACING=1 plus COLLECTOR_SERVICE_ADDR
# (host:port, plaintext gRPC). Only services with OTel support upstream are
# patched. OTEL_SERVICE_NAME is set because the services otherwise report as
# `unknown_service`, which would break the RCA service graph (D21).
# adservice, cartservice, shippingservice and emailservice are not.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - name: OTEL_SERVICE_NAME
              value: "frontend"
            - name: ENABLE_TRACING
              value: "1"
            - name: COLLECTOR_SERVICE_ADDR
              value: "jaeger-collector.monitoring.svc.cluster.local:4317"
---
