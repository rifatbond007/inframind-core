# testbed/helm-values/jaeger.yaml
#
# Slim-default values for the Jaeger Helm chart (3.3.0), allInOne strategy.
#
# Why allInOne and not collector + query pods: with `storage.type: memory`
# each process keeps its own in-memory span store. A separate collector pod
# receives and stores spans in its memory, while the query pod reads its own
# (empty) memory, so the UI never shows a trace. allInOne is one process
# serving both. Spans are lost on pod restart, which is fine for the testbed.
#
# The chart exposes allInOne Services as ClusterIP only. The NodePorts that
# kind forwards to the host (30686 UI, 30317/30318 OTLP; D1/D4) come from
# testbed/obs/jaeger-nodeports.yaml, applied by testbed/obs/install.sh.
storage:
  type: memory

provisionDataStore:
  cassandra: false
  elasticsearch: false
  kafka: false

allInOne:
  enabled: true
  replicas: 1
  image:
    tag: "1.59"
  # The OTLP receivers bind to localhost inside the pod by default, so
  # other pods get "connection refused" on 4317/4318. Bind to all interfaces.
  extraEnv:
    - name: COLLECTOR_OTLP_GRPC_HOST_PORT
      value: "0.0.0.0:4317"
    - name: COLLECTOR_OTLP_HTTP_HOST_PORT
      value: "0.0.0.0:4318"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

collector:
  enabled: false
query:
  enabled: false
agent:
  enabled: false
ingester:
  enabled: false
sampling:
  enabled: false
provisioning:
  enabled: false
storageCleaner:
  enabled: false
hotrod:
  enabled: false
