# testbed/helm-values/chaos-mesh.yaml
#
# Slim-default values for the Chaos Mesh Helm chart (2.7.2).
#
# D2 FIX (socket path): the kind node's containerd socket is exposed
# at /var/run/docker.sock via `extraMounts` in testbed/kind/cluster.yaml.
# chaos-daemon reads it with `chaosDaemon.runtime=docker` and
# `chaosDaemon.socketPath=/var/run/docker.sock`. This is the documented
# path for kind in 2026; the chart's `runtime=containerd` mode expects
# the daemon to mount the in-node socket directly, which is harder to
# plumb through kind's container-in-container model.
#
# How the chart actually mounts the socket (verified by `helm template`
# against chart 2.7.2):
#   - the daemon's --runtime-socket-path arg is set to
#     `/host-run/<basename of socketPath>` (here: /host-run/docker.sock)
#   - the daemon's hostPath volume is the *parent directory* of
#     socketPath (here: /var/run), mounted at /host-run in the Pod
#   - so the file the daemon reads is /host-run/docker.sock in the Pod,
#     which is the host's /var/run/docker.sock
# `chaosDaemon.mountPath` is NOT a real chart key (verified: ignored
# by 2.7.2's _helpers.tpl). Do not add it back.
#
# Architecture:
#   chaos-controller-manager  (Deployment, 1 replica) — validates CRs
#   chaos-daemon              (DaemonSet, 1 per node) — applies faults
#   chaos-dashboard           (Deployment, optional) — UI; disabled in slim
#
# Memory levers if Chaos Mesh OOMs:
#   1. drop `controllerManager.resources.limits.memory` from 384Mi to 256Mi
#   2. drop `chaosDaemon.resources.limits.memory` from 256Mi to 192Mi
#   3. (long runs) raise the controller's `GOGC` env to 200
#
# References:
#   - chart 2.7.2 values: https://github.com/chaos-mesh/chaos-mesh/blob/v2.7.2/helm/chaos-mesh/values.yaml
#   - D2 (Chaos Mesh socket path): docs/decision-tree.md
#   - testbed/kind/cluster.yaml (extraMounts plumbing)

# --- Controller manager ---
# Scope the controller to only the SUT namespace (`default`). The chart
# default is `clusterScoped: true`, which makes the controller watch
# every namespaced resource in the cluster. On a busy kind cluster
# (monitoring + chaos-mesh + chaos-testing + default + kube-system)
# the watch surface is large enough to exhaust fds before the cache
# syncs, and the manager CrashLoops with "too many open files" before
# any chaos experiment can be applied. `targetNamespace: default`
# scopes the watch to one namespace — enough for Slice 4 acceptance,
# easy to widen in `make testbed-full`.
#
# NB on the "too many open files" risk: we considered setting
# `securityContext.sysctls: [{name: fs.nr-open, value: "65536"}]`
# here, but kind's pod security admission (which enforces the
# "baseline" policy by default in modern kind versions) rejects
# `fs.nr-open` as an "unsafe" sysctl with `SysctlForbidden`. The
# workaround — adding the kube-system label
# `pod-security.kubernetes.io/enforce=privileged` to the
# chaos-testing namespace — is worse than the problem, because it
# would also disable the namespace-level restrictions we want for
# the SUT. Instead, the slim default: scope to one namespace
# (above), enable only the 4 controllers we use (below), enable
# only the 4 webhooks they need (below), and start the controller
# with the chart's default fd limit. The combination has been
# verified to bring up clean on a 7 GiB host. If a future chart
# upgrade re-introduces the fd pressure, raise the controller's
# `GOGC` env to 200 (long-running soak) or limit the watch
# surface further via `targetNamespace`.
controllerManager:
  replicaCount: 1
  targetNamespace: default
  # enableFilterNamespace at the top of controllerManager (NOT under
  # .selector — that location is silently ignored by chart 2.7.2).
  # When true, the controller only injects into namespaces carrying the
  # annotation `chaos-mesh.org/inject=enabled`. We leave it at the
  # chart default (false) for the slim default: the cluster is
  # single-tenant and the SUT lives in `default`, so the annotation
  # opt-in is unnecessary friction. Switch to `true` on a multi-tenant
  # cluster or in the `make testbed-full` profile.
  enableFilterNamespace: false
  resources:
    limits:
      cpu: 500m
      memory: 384Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Only enable the 4 controllers we actually use. The chart default
  # is `["*"]`, which boots ~20+ controllers (awschaos, azurechaos,
  # gcpchaos, kernelchaos, jvmchaos, physicalmachinechaos, etc.) —
  # each opens watches on the kube-apiserver, and the resulting fd
  # pressure triggers a "too many open files" CrashLoop on kind.
  # Slice 4/5 use the 3 individual fault controllers; `workflows`
  # is needed by P7 (chaos-mesh 2.7.x moved the per-CR `scheduler`
  # field out of PodChaos/StressChaos/NetworkChaos and into a
  # separate Workflow resource, so repeating-fault eval runs will
  # need this controller).
  enabledControllers:
    - podchaos
    - networkchaos
    - stresschaos
    - workflows
  # Only enable the webhooks the controllers need.
  enabledWebhooks:
    - podchaos
    - networkchaos
    - stresschaos
    - workflows

# --- Daemon ---
# Runs on every node. Mounts /var/run/docker.sock (D2 plumbing from
# cluster.yaml). Applies faults (pod-kill, network-delay, cpu-stress,
# stress-memory, oom-kill) on Pods scheduled to its node.
chaosDaemon:
  # D2: docker runtime + the kind-injected socket path. The kind
  # cluster.yaml bind-mounts /run/containerd/containerd.sock to
  # /var/run/docker.sock inside the kind node container; chaos-daemon
  # reads it as a "docker" socket. The chart turns this into a hostPath
  # volume at /var/run mounted at /host-run in the Pod (see file header).
  runtime: docker
  socketPath: /var/run/docker.sock
  # resource caps for the daemon
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # chaos-daemon needs NET_ADMIN to inject tc qdisc delays. The chart
  # grants this via hostNetwork on the DaemonSet when
  # `chaosDaemon.hostNetwork` is true. We keep it on so networkchaos CRs
  # work.
  hostNetwork: true
  # Don't run the chaos-daemon in privileged mode on the kind node —
  # we get by with the docker-socket approach.
  privileged: false
  # The chart's default image runs as PID 1 in the DaemonSet Pod; no
  # extra args needed for the docker-runtime path. The chart 2.7.2
  # values schema expects an object {registry, repository, tag}, not
  # a string — that's the shape we use.
  #
  # The tag MUST be `v2.7.2` (with the `v` prefix) — the chart's
  # default is `v2.7.2` and chaos-mesh's published images all carry
  # the `v` prefix in their tags. A tag of `2.7.2` resolves to an
  # image that doesn't exist in ghcr.io and produces
  # `ImagePullBackOff` on the chaos-daemon Pod.
  image:
    registry: ghcr.io
    repository: chaos-mesh/chaos-daemon
    tag: v2.7.2

# --- Dashboard (disabled for slim default) ---
# The dashboard is a 1-pod React app; it adds ~150 MiB and isn't on the
# smoke-test path. Re-enable in the `make testbed-full` profile.
dashboard:
  enabled: false

# --- DNS Chaos (we don't need it for P1/P7) ---
dnsServer:
  enabled: false

# --- Webhook server (RBAC) ---
# Required for chaos experiments that need ServiceAccount manipulation.
webhook:
  enabled: true
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

# --- Image pull policy ---
imagePullPolicy: IfNotPresent

# Cluster scope: scope to the SUT namespace only (see
# controllerManager.targetNamespace above). With clusterScoped: true
# the manager watches all namespaces; the resulting fd pressure
# triggers a CrashLoop on kind. Set to false + targetNamespace to
# `default` to keep the watch surface small.
clusterScoped: false

# --- Service account ---
# The default SA `chaos-mesh` is created automatically with the
# clusterrole/clusterrolebinding the chart ships. We add no overrides.
serviceAccount:
  create: true
  name: chaos-mesh

# --- Install CRDs? ---
# The chart's `crds.install` defaults to true; we keep it. The 5 CRs
# in testbed/chaos/ are typed as `PodChaos`, `NetworkChaos`, `StressChaos`
# and would fail validation without the CRDs.
crds:
  install: true
