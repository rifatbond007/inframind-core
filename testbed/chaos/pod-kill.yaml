# testbed/chaos/pod-kill.yaml
#
# PodChaos: kill the `frontend` pod once per minute, bounded to a 5-min
# window. This is the P1 → P2 gate check #6 — Prometheus records a
# `kube_pod_container_status_restarts_total` increment, Loki shows
# a `Killing` log line, and (if OTel is wired) Jaeger shows a
# `frontend` trace ending in error.
#
# Schedule offset: cron "@every 1m" fires on the minute boundary (t=0,
# t=60s, t=120s, ...). oom-kill.yaml is anchored to "1/2 * * * *" (t=60s,
# t=180s, ...) so the two CRs never land on the same second. This makes
# the C6 restart-counter signal attributable: a PodChaos (new UID) vs a
# PodChaos container-kill (same UID, restart count increment only) are
# distinguishable in the timing.
#
# Apply with:
#   kubectl --context kind-inframind apply -f testbed/chaos/pod-kill.yaml
# Then wait ~30s and check:
#   kubectl --context kind-inframind get podchaos -n chaos-testing
#   promtool query instant http://localhost:30090 \
#     'sum(increase(kube_pod_container_status_restarts_total{namespace="default",pod=~"frontend-.*"}[5m]))'
#
# Cleanup with:
#   kubectl --context kind-inframind delete -f testbed/chaos/pod-kill.yaml
#
# References:
#   - testbed/README.md §4 (P1 → P2 gate check #6)
#   - docs/standards/09-testbed-ops.md §9.4 (chaos guard rails)

apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: boutique-frontend-pod-kill
  namespace: chaos-testing
spec:
  action: pod-kill
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: frontend
  # Bounded to a 5-min experiment window. Without `duration`, the CR
  # lives forever and the scheduler fires every minute indefinitely,
  # which is fine for an eval run but bad for a long-lived cluster.
  duration: "5m"
  scheduler:
    cron: "@every 1m"
