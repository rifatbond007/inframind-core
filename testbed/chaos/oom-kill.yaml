# testbed/chaos/oom-kill.yaml
#
# PodChaos: kill the frontend container every 2 minutes for a 5-minute
# window. Distinct from stress-memory (which holds memory until the
# kernel OOM-killer fires) — this is a deterministic container-kill
# that mimics a memory-pressure / cgroup-OOM event the kernel can't
# distinguish from a real one. The frontend pod will be re-created by
# the Deployment; the restart counter + Loki `Killing` log line
# surface in Prom/Loki the same way the stress-memory CR does.
#
# Why "container-kill" not "pod-kill": container-kill hits just the
# first container in the pod, leaving the Pod's identity intact (same
# UID, same IP, same restart count increment). Pod-kill terminates
# the whole pod. The cgroup-OOM-killer does the former; this CR
# reproduces that exact signature.
#
# Used by:
#   - P7 evaluation (oom-kill scenario)
#   - P4 detection (error spike on the restart)
#
# Apply:
#   kubectl --context kind-inframind apply -f testbed/chaos/oom-kill.yaml
# Cleanup:
#   kubectl --context kind-inframind delete -f testbed/chaos/oom-kill.yaml
#
# References:
#   - chart 2.7.2 docs: https://chaos-mesh.org/docs/simulate-pod-chaos-on-kubernetes/
#   - testbed/chaos/stress-memory.yaml (the related stress-fault)

apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: boutique-frontend-oom-kill
  namespace: chaos-testing
spec:
  action: container-kill
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: frontend
  # containerNames is optional for container-kill; leaving it absent
  # kills the first container in the pod (which is `server` for the
  # Boutique frontend). For multi-container pods this would need
  # explicit `containerNames: [server]`.
  duration: "5m"
  scheduler:
    cron: "@every 2m"
